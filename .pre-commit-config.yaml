repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier
        name: prettier (workspace)
        language: system
        files: ^(api-types|rules|frontend)/.*\.(js|jsx|ts|tsx|css|json|md)$
        entry: npx prettier --write
      - id: eslint
        name: eslint (workspace)
        language: system
        files: ^(api-types|rules|frontend)/.*\.(js|jsx|ts|tsx)$
        entry: npx eslint --fix
