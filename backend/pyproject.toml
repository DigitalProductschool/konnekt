[project]
name = "konnekt-backend"
version = "0.1.0"
description = "Konnekt's backend: the middleware between serviceBW forms and the EUDI Wallet"
requires-python = ">=3.13"

dependencies = [
    # Web Framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",

    # Database — PostgreSQL (sync psycopg 3 driver)
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.5",

    # Config & Environment (pydantic-settings reads .env itself, no python-dotenv needed)
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",

    # Sign-in: Argon2id password hashes
    "argon2-cffi>=25.1.0",

    # Sync HTTP client for EUDIPLO; TestClient needs it too
    "httpx2>=2.12.0",

    # QR codes of the wallet links, as PNG without Pillow
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",      # Linter + formatter
    "mypy>=2.3.1",       # Type checking
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",     # Test runner
    "faker>=40.39.0",    # Random test people for scripts/issue_test_credentials
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle + pyflakes + isort

[tool.ruff.format]
quote-style = "single"     # matches the convention documented in CLAUDE.md

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

# Keep pytest config here only. A backend/pytest.ini would take precedence and
# silently shadow this whole block.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
