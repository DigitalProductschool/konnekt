services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: konnekt_db
    ports:
      - '5435:5432'
    volumes:
      # postgres:18+ stores data in a major-version subdirectory and refuses to
      # start if the volume is mounted at the old /var/lib/postgresql/data path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - '3000:3000'
    # EUDIPLO credentials and the other settings from backend/.env (not committed).
    # The values under `environment` below take precedence over the file.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/konnekt_db
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      APP_ENV: development
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/alembic:/app/backend/alembic
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
      - ./api-types:/app/api-types
      - ./rules:/app/rules
      - ./tsconfig.base.json:/app/tsconfig.base.json
    depends_on:
      - backend

  # The MCP server for agents (spec 007). One replica: 2025-era MCP sessions live in
  # its memory (research R2)
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile.dev
    ports:
      - '3100:3100'
    environment:
      PORT: 3100
      BACKEND_URL: http://backend:3000
      PORTAL_URL: http://localhost:5173
      MCP_URL: http://localhost:3100/mcp
      OAUTH_ISSUER: http://localhost:3000
    volumes:
      - ./mcp/src:/app/mcp/src
      - ./mcp/plugin:/app/mcp/plugin
      - ./api-types:/app/api-types
      - ./rules:/app/rules
    depends_on:
      - backend

volumes:
  postgres-data:
