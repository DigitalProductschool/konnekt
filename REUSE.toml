version = 1

# Every file: the team's, under the EUPL-1.2. The blocks below override it for the files that
# are others' or under other terms; where several blocks match a file, the last one wins.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Team Faro, Batch#27, Digital Product School"
SPDX-License-Identifier = "EUPL-1.2"

# The team's files that quote others' copyright lines or SPDX tags: this block, not their text,
# states their holder and licence (the notices, the script that writes the served notices and
# the notices it writes, the specs).
[[annotations]]
path = [
  "NOTICE.md",
  "frontend/scripts/third-party-notices.mjs",
  "frontend/public/THIRD-PARTY-NOTICES.txt",
  "specs/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Team Faro, Batch#27, Digital Product School"
SPDX-License-Identifier = "EUPL-1.2"

# Fira Sans, Fira Mono and their licence text (research R3)
[[annotations]]
path = ["frontend/src/assets/fonts/*.ttf", "frontend/src/assets/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2012-2015 The Mozilla Foundation and Telefonica S.A.",
  "2012-2013 The Mozilla Corporation and Telefonica S.A.",
]
SPDX-License-Identifier = "OFL-1.1"

# Material Symbols and Material Icons, 11 through KERN's icon set (research R2, R3)
[[annotations]]
path = "frontend/src/assets/icons/*.svg"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# The five glyphs changed by the team
[[annotations]]
path = [
  "frontend/src/assets/icons/add-link-action.svg",
  "frontend/src/assets/icons/copy-to-variant.svg",
  "frontend/src/assets/icons/calendar-pencil.svg",
  "frontend/src/assets/icons/message-alert.svg",
  "frontend/src/assets/icons/ungroup-brackets.svg",
]
precedence = "override"
SPDX-FileCopyrightText = ["Google LLC", "2026 Team Faro, Batch#27, Digital Product School"]
SPDX-License-Identifier = "Apache-2.0"

# Spec Kit v1.1.1 (research R3)
[[annotations]]
path = [
  ".specify/scripts/**",
  ".specify/templates/**",
  ".specify/extensions/bug/**",
  ".specify/workflows/speckit/**",
  ".claude/skills/speckit-*/**",
]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"

# Unicode Character Database 15.1.0, through Python 3.13's str.casefold() (research R3)
[[annotations]]
path = "rules/src/checks/caseFolding.ts"
precedence = "override"
SPDX-FileCopyrightText = ["Unicode, Inc.", "2026 Team Faro, Batch#27, Digital Product School"]
SPDX-License-Identifier = "Unicode-3.0"

[[annotations]]
path = "rules/src/checks/fixtures/evaluator-vectors.json"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Team Faro, Batch#27, Digital Product School", "Unicode, Inc."]
SPDX-License-Identifier = "EUPL-1.2 AND Unicode-3.0"

# Wholly the template's (research R3); EUPL-1.2 by the mentor's confirmation
[[annotations]]
path = [
  "backend/alembic/versions/v0_add_team_members.py",
  "backend/alembic/env.py",
  "backend/alembic.ini",
  "backend/alembic/script.py.mako",
  "backend/.dockerignore",
  "frontend/.dockerignore",
  "backend/app/__init__.py",
  "frontend/src/vite-env.d.ts",
  "frontend/.prettierrc",
  "frontend/tsconfig.json",
  "frontend/.prettierignore",
  "frontend/.env.example",
  "backend/app/routers/__init__.py",
  "backend/.python-version",
]
precedence = "override"
SPDX-FileCopyrightText = "Digital Product School"
SPDX-License-Identifier = "EUPL-1.2"

# The template's files that this project changes (the backend Dockerfiles, research R1 and R6)
[[annotations]]
path = ["backend/Dockerfile", "backend/Dockerfile.dev"]
precedence = "override"
SPDX-FileCopyrightText = ["Digital Product School", "2026 Team Faro, Batch#27, Digital Product School"]
SPDX-License-Identifier = "EUPL-1.2"

# The patch for EUDIPLO 9 (docs/COMPATIBILITY.md): the team's change, with the lines of
# EUDIPLO's files around it
[[annotations]]
path = "docs/patches/eudiplo-9.0.0-mdoc-nested-maps.patch"
precedence = "override"
SPDX-FileCopyrightText = ["2025 Mirko Mollik", "2026 Team Faro, Batch#27, Digital Product School"]
SPDX-License-Identifier = "Apache-2.0"
