# A request reference is the key to a request's documents, so the access log shows
# /requests/<reference> instead of it (research R13). The OAuth endpoints read no
# query, and one sent there could hold a code or a token: the log shows
# ?<redacted> instead (spec 007, research R18)
map $request_uri $redacted_request_uri {
    "~*^(?<connect_path>[^?]*/connect/[^?]*/requests/)[^/?]+(?<connect_rest>.*)$" $connect_path<reference>$connect_rest;
    "~*^(?<oauth_path>/api/oauth/[^?]*)[?]" $oauth_path?<redacted>;
    default $request_uri;
}

# nginx's "main" format, with the request line rebuilt from the redacted URI
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log redacted;

    # The client's address from X-Forwarded-For, when the request comes from a
    # trusted proxy (TRUSTED_PROXY_CIDRS). Written by 40-servicebw-access.sh
    include /etc/nginx/real-ip.conf;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json font/ttf;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API calls to the backend container (same-origin, so no CORS).
    # ${BACKEND_HOST} is rendered by the nginx image's envsubst templating at
    # container start (this file is installed as a template, see Dockerfile);
    # nginx runtime variables like $host are untouched because only defined
    # environment variables are substituted.

    # serviceBW's connection URLs, without credentials: only the addresses in
    # SERVICEBW_ALLOWED_CIDRS may call them, and nginx answers 403 to everyone
    # else, without involving the backend (FR-017, research R13)
    location /api/connect/ {
        include /etc/nginx/servicebw-allow.conf;
        # nginx's error lines quote the request line, which holds the reference, so
        # only critical ones are logged here. The access log still has every status
        error_log /var/log/nginx/error.log crit;

        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # A connection at the product's limits (FR-045) has a save body of about
        # 1.56 MB, and nginx's default of 1 MB would answer 413: 4 MB leaves room
        # of about 2.5 times that (spec 011, decision D12)
        client_max_body_size 4m;
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The MCP server for agents (spec 007, research R3). Every method passes: POST
    # for requests, GET for a 2025-era session's stream, DELETE for its end, and the
    # Mcp-Session-Id header with them (nginx forwards request headers unchanged).
    # Responses are event streams, so nothing is buffered, and a stream may stay open
    # while a tool call waits for the team member's approval
    location = /mcp {
        proxy_pass http://${MCP_HOST}:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # RFC 9728: the MCP server is the protected resource, so it answers its metadata,
    # in the root form and the path-based form (/.well-known/oauth-protected-resource/mcp)
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://${MCP_HOST}:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RFC 8414: the backend is the authorization server, so it answers its metadata
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep FastAPI's interactive docs reachable
    location = /docs {
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_set_header Host $host;
    }

    # Handle React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
