# A request reference is the key to a request's documents, so the access log shows
# /requests/<reference> instead of it (research R13). The OAuth endpoints read no
# query, and one sent there could hold a code or a token: the log shows
# ?<redacted> instead (spec 007, research R18)
map $request_uri $redacted_request_uri {
    "~*^(?<connect_path>[^?]*/connect/[^?]*/requests/)[^/?]+(?<connect_rest>.*)$" $connect_path<reference>$connect_rest;
    "~*^(?<oauth_path>/api/oauth/[^?]*)[?]" $oauth_path?<redacted>;
    default $request_uri;
}

# nginx's "main" format, with the request line rebuilt from the redacted URI
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $redacted_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

# Sign-in attempts per client address, as real-ip.conf resolves it: each one costs
# an Argon2id hash of 64 MiB, so one address gets one every 2 seconds and can't run
# them side by side (spec 012, research R6, finding 4). 10 MB of state holds
# tens of thousands of addresses
limit_req_zone $binary_remote_addr zone=sign_in:10m rate=30r/m;

# OAuth requests per client address, as real-ip.conf resolves it (spec 012, research
# R6, finding 5). Registration is open and stores a client: a burst of 20 (a team
# connecting its agents together), then one every 6 seconds. The rest of
# /api/oauth/ (the token endpoint, where every agent renews its access about once
# an hour, and the consent page's two calls): a burst of 60, then one a second,
# for an office of agents behind one address
limit_req_zone $binary_remote_addr zone=oauth_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=oauth:10m rate=60r/m;

# The message of nginx's own 429 for a sign-in, in German when the Accept-Language
# header's first tag is German, as the backend decides (app/language.py)
map $http_accept_language $sign_in_limited_message {
    "~*^\s*de(\s*(,|$)|[-_])" "Zu viele Anmeldeversuche aus diesem Netzwerk. Versuchen Sie es in einem Moment erneut.";
    default "Too many sign-in attempts from this network. Try again in a moment.";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log redacted;

    # No nginx version in the Server header or on nginx's own error pages (spec 012,
    # research R6, finding 20)
    server_tokens off;

    # The client's address from X-Forwarded-For, when the request comes from a
    # trusted proxy (TRUSTED_PROXY_CIDRS). Written by 40-servicebw-access.sh
    include /etc/nginx/real-ip.conf;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json font/ttf;

    # Security headers, on every answer. A location with add_header lines of its own
    # (the assets', index.html's) would drop these, so "merge" adds them there too,
    # and in every location below, current or future. Needs nginx 1.29.3 or later;
    # the image is 1.31.9. No page of the app frames another, so no one may frame
    # it, the consent and approval pages included (spec 012, research R6, finding 3)
    add_header_inherit merge;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API calls to the backend container (same-origin, so no CORS).
    # ${BACKEND_HOST} is rendered by the nginx image's envsubst templating at
    # container start (this file is installed as a template, see Dockerfile);
    # nginx runtime variables like $host are untouched because only defined
    # environment variables are substituted.

    # serviceBW's connection URLs, without credentials: only the addresses in
    # SERVICEBW_ALLOWED_CIDRS may call them, and nginx answers 403 to everyone
    # else, without involving the backend (FR-017, research R13)
    location /api/connect/ {
        include /etc/nginx/servicebw-allow.conf;
        # nginx's error lines quote the request line, which holds the reference, so
        # only critical ones are logged here. The access log still has every status
        error_log /var/log/nginx/error.log crit;

        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # A connection at the product's limits (FR-045) has a save body of about
        # 1.56 MB, and nginx's default of 1 MB would answer 413: 4 MB leaves room
        # of about 2.5 times that (spec 011, decision D12)
        client_max_body_size 4m;
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sign-in, limited per client address (limit_req_zone above): a burst of 5 more
    # attempts waits its turn instead of running at once, and beyond it nginx
    # answers 429 itself, in the API's {error, message} envelope so that the
    # sign-in page shows its message. The backend also makes a username wait after
    # failed attempts (spec 012, research R6, finding 4). The rest as /api/, with a
    # body limit for the sign-in's: both fields at their longest as JSON escapes
    # stay under 16 KB
    location = /api/auth/login {
        limit_req zone=sign_in burst=5;
        limit_req_status 429;
        error_page 429 = @sign_in_limited;
        client_max_body_size 16k;
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @sign_in_limited {
        default_type application/json;
        return 429 '{"error":"rate_limited","message":"$sign_in_limited_message"}';
    }

    # The OAuth endpoints (spec 007), limited per client address (limit_req_zone
    # above): beyond a burst nginx answers 429 itself, in the body the OAuth
    # endpoints answer (RFC 6749 5.2), and beyond 16 KB 413 with its own page. No
    # client sends that much: a registration is under 1 KB, a token request with
    # the longest client id and redirect URI under 9 KB (spec 012, research R6,
    # finding 5). A refusal's error line would quote the request line with the
    # query that the access log redacts: it is logged at info, below the image's
    # notice, and the access log has every 429. ^~: never a static file, whatever
    # the path ends in. The rest as /api/
    location ^~ /api/oauth/ {
        limit_req zone=oauth burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 = @oauth_limited;
        client_max_body_size 16k;
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Registration, open to anyone, has the stricter limit of its own
    location = /api/oauth/register {
        limit_req zone=oauth_register burst=20 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 = @oauth_limited;
        client_max_body_size 16k;
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The MCP TypeScript SDK reads too_many_requests as a rate limit and keeps the
    # agent's credentials; English, as every OAuth error description
    location @oauth_limited {
        default_type application/json;
        return 429 '{"error":"too_many_requests","error_description":"Too many requests from this network. Try again in a moment."}';
    }

    # The MCP server for agents (spec 007, research R3). Every method passes: POST
    # for requests, GET for a 2025-era session's stream, DELETE for its end, and the
    # Mcp-Session-Id header with them (nginx forwards request headers unchanged).
    # Responses are event streams, so nothing is buffered, and a stream may stay open
    # while a tool call waits for the team member's approval
    location = /mcp {
        proxy_pass http://${MCP_HOST}:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # RFC 9728: the MCP server is the protected resource, so it answers its metadata,
    # in the root form and the path-based form (/.well-known/oauth-protected-resource/mcp)
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://${MCP_HOST}:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RFC 8414: the backend is the authorization server, so it answers its metadata
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep FastAPI's interactive docs reachable
    location = /docs {
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://${BACKEND_HOST}:3000;
        proxy_set_header Host $host;
    }

    # Handle React Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The served notices are UTF-8 (the German EUPL text): say so, for this file only
    location = /THIRD-PARTY-NOTICES.txt {
        charset utf-8;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
