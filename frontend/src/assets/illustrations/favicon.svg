<!-- The tab icon: logo.svg's squares, without a background. Change both files together.
     The one exception to the light-only app: the browser draws the tab bar in its own theme,
     so the squares are blue on a light one and white on a dark one (Figma "logo for website") -->
<style>
  path { fill: #1D56F0; }
  @media (prefers-color-scheme: dark) {
    path { fill: #FFFFFF; }
  }
</style>
