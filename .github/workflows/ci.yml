# The checks of "Before you finish" in CLAUDE.md, a scan for secrets and the REUSE check, on
# every push and pull request (README.md, "Continuous integration"). One job per kind of check and side, so each one
# is its own status check on a pull request; they all run in parallel
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run, except on main,
# where every commit keeps its result
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Versions as in the Dockerfiles: uv 0.12.9 and Node 26 here, Python from
# backend/.python-version (3.13, whose Unicode version the rule checks' generated fixtures
# pin). Change them together. `uv sync --locked` fails when uv.lock no longer matches
# pyproject.toml; `npm ci --ignore-scripts`, as in the Dockerfiles, also skips the root's
# prepare script, which installs the pre-commit hooks.
# Every action is pinned to the commit of a release, the version in the comment. Since v8.0.0,
# setup-uv publishes only immutable releases and no floating major tag (no `@v10`; its README);
# actions/checkout and actions/setup-node still move their major tags (`@v7`), so a pin by
# commit keeps a moved tag from changing what runs here

jobs:
  backend-lint:
    name: 'Backend: lint & format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          working-directory: backend
          enable-cache: true
      - name: Install dependencies
        id: install
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      # Runs after a failed lint too, so one run reports both
      - name: Ruff (format)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check --diff .

  backend-types:
    name: 'Backend: types'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          working-directory: backend
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked

      - name: mypy
        run: uv run mypy app/ scripts/ tests/

  backend-tests:
    name: 'Backend: tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # The PostgreSQL of docker-compose.yml. The tests empty their database, so its name
    # ends in _test; they build the schema from the migrations themselves
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konnekt_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/konnekt_db_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'
          working-directory: backend
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked

      # EUDIPLO is faked and the worker is off (tests/conftest.py); the tests also check
      # that rules/src/checks/'s generated fixtures are current
      - name: pytest
        run: uv run pytest -ra

  workspace-lint:
    name: 'Frontend & packages: lint & format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint
      # Runs after a failed lint too, so one run reports both
      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

  workspace-types:
    name: 'Frontend & packages: types & build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # tsc for every package, then the frontend's and the MCP server's production builds
      - name: Type-check and build
        run: npm run build

  workspace-tests:
    name: 'Frontend & packages: tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # rules/, frontend/ and mcp/, including the MCP guidance gate (mcp/src/guidance.test.ts)
      # and the replay of the evaluator's vectors
      - name: Vitest
        run: npm test

  # gitleaks, the MIT command-line tool, at the version of the hook in .pre-commit-config.yaml:
  # change them together. Not gitleaks-action, whose license needs a key for an organization's
  # repositories (README.md, "Secrets (gitleaks)")
  secrets:
    name: 'Secrets: gitleaks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
      # Of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, which the scan reads
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Every commit the checked-out one reaches: main's and the branch's, not the other
      # branches' (`--log-opts=HEAD`; without it, gitleaks reads `--all`). A finding prints its
      # file, line, commit and fingerprint, never the secret (`--redact`)
      - name: gitleaks
        run: gitleaks git --log-opts=HEAD --redact --verbose --no-banner

  # The REUSE Specification: every file has a licence and a copyright holder, from REUSE.toml
  # in the root, and LICENSES/ holds exactly the licence texts those name (no missing, no unused
  # one). reuse, the tool of the FSFE, at an exact version through uvx; change it here only
  licensing:
    name: 'Licensing: REUSE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.9'

      - name: reuse lint
        run: uvx --from reuse==6.3.0 reuse lint
