# Production compose file for any Docker host behind a reverse proxy that
# provides HTTPS.
#
# No service publishes a port: the proxy forwards every request for the public
# domain to the frontend service's nginx on port 80, either as a container
# attached to this project's network (forwarding to http://frontend:80) or on
# the host, through an override file of your own that publishes
# 127.0.0.1:8080:80 on frontend. Backend, mcp and postgres are reachable only
# on the internal network. SERVICE_PASSWORD_POSTGRES is required.
#
# Local dev uses docker-compose.yml instead.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?SERVICE_PASSWORD_POSTGRES must be set to the database password}
      POSTGRES_DB: konnekt_db
    volumes:
      # postgres:18+ stores data in a major-version subdirectory and refuses to
      # start if the volume is mounted at the old /var/lib/postgresql/data path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${SERVICE_PASSWORD_POSTGRES:?SERVICE_PASSWORD_POSTGRES must be set to the database password}@postgres:5432/konnekt_db
      PORT: 3000
      APP_ENV: production
      # The public https:// address. The backend refuses to start without an
      # https:// CONNECTION_BASE_URL (research R18).
      CONNECTION_BASE_URL: ${CONNECTION_BASE_URL}
      EUDIPLO_URL: ${EUDIPLO_URL}
      EUDIPLO_CLIENT_ID: ${EUDIPLO_CLIENT_ID}
      EUDIPLO_CLIENT_SECRET: ${EUDIPLO_CLIENT_SECRET}
      EUDIPLO_TRUST_LIST_ID: ${EUDIPLO_TRUST_LIST_ID}
      REQUEST_LIFETIME_SECONDS: ${REQUEST_LIFETIME_SECONDS:-600}
      DOCUMENT_RETENTION_SECONDS: ${DOCUMENT_RETENTION_SECONDS:-1800}
      PULL_REPEAT_WINDOW_SECONDS: ${PULL_REPEAT_WINDOW_SECONDS:-60}
      REQUEST_RECORD_RETENTION_SECONDS: ${REQUEST_RECORD_RETENTION_SECONDS:-604800}
      ALLOW_PLAIN_HTTP: ${ALLOW_PLAIN_HTTP:-false}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      LOGIN_SESSION_HOURS: ${LOGIN_SESSION_HOURS:-8}
      # Agent access (spec 007): the public addresses the OAuth server and the links
      # are built from, all on the one public domain (research R3)
      PORTAL_URL: ${CONNECTION_BASE_URL}
      MCP_URL: ${CONNECTION_BASE_URL}/mcp
      OAUTH_ISSUER: ${CONNECTION_BASE_URL}
      AGENT_ACCESS_TOKEN_MINUTES: ${AGENT_ACCESS_TOKEN_MINUTES:-60}
      AGENT_CONNECTION_IDLE_DAYS: ${AGENT_CONNECTION_IDLE_DAYS:-30}
      AGENT_TOKEN_MAX_DAYS: ${AGENT_TOKEN_MAX_DAYS:-90}
      APPROVAL_REQUEST_MINUTES: ${APPROVAL_REQUEST_MINUTES:-10}
      AGENT_DRAFTS_PER_HOUR: ${AGENT_DRAFTS_PER_HOUR:-20}
    healthcheck:
      # python:3.13-slim ships neither curl nor wget
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Bare declaration, passed through when set: a hosting platform may read it
      # to route the public domain here. Nothing in the container reads it
      - SERVICE_FQDN_FRONTEND
      # Backend hostname for the nginx /api proxy
      - BACKEND_HOST=backend
      # Comma-separated address ranges that may call /api/connect/ (serviceBW).
      # Empty closes it: nginx answers 403 to everyone (research R13)
      - SERVICEBW_ALLOWED_CIDRS=${SERVICEBW_ALLOWED_CIDRS:-}
      # Comma-separated ranges of the reverse proxy in front of nginx, as nginx
      # sees its connections arrive, whose X-Forwarded-For is trusted. Empty:
      # the connecting address counts
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      # MCP server hostname for the nginx /mcp proxy
      - MCP_HOST=mcp
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget doesn't fall back from ::1,
      # where nginx isn't listening
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
      mcp:
        condition: service_started

  # The MCP server for agents (spec 007), reached only through nginx's /mcp. One
  # replica: 2025-era MCP sessions live in its memory (research R2)
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3100
      BACKEND_URL: http://backend:3000
      PORTAL_URL: ${CONNECTION_BASE_URL}
      MCP_URL: ${CONNECTION_BASE_URL}/mcp
      OAUTH_ISSUER: ${CONNECTION_BASE_URL}
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget doesn't fall back from ::1
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3100/health > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
